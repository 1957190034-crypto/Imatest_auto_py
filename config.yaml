# Imatest 基本配置
imatest:
  root_dir: "./"                # 工作根目录（通常为项目根目录）
  ini_file: "./imatest_base.ini"  # Imatest 配置文件路径
  op_mode: "OP_MODE_STANDARD"   # 对应 ImatestLibrary.OP_MODE_STANDARD

# 路径配置
paths:
  images_base: "./test_images"   # 存放设备文件夹的根目录
  output_base: "./output"

# 模块映射：文件夹名 -> Imatest API 方法后缀
modules:
  SFRplus: "sfrplus"
  Checkerboard: "checkerboard"
  Colorchecker: "color_tone"
  Random: "random"
  Flatfield: "flatfield"

# 支持的图片扩展名（小写）
image_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".tif"
  - ".tiff"
  - ".bmp"
  - ".pg"

# 处理选项
processing:
  save_raw_json: true           # 是否保存每张图片的原始JSON
  save_per_image_csv: true   # 新增：每张图片单独保存指标CSV
  resume_enabled: true          # 是否启用断点续跑（跳过已处理图片）
  processed_record: "./processed.pkl"  # 断点记录文件路径